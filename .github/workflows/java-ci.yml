name: "Java CI"
on:
  push:
    branches: ['openhouse-1.2.0']
    tags-ignore: [v*]
  pull_request:
    branches: ['openhouse-1.2.0']
    paths-ignore:
    - '.github/workflows/python-ci.yml'
    - '.github/workflows/spark-ci.yml'
    - '.github/workflows/flink-ci.yml'
    - '.github/workflows/hive-ci.yml'
    - '.gitignore'
    - 'dev/**'
    - 'python/**'
    - 'python_legacy/**'
    - 'docs/**'
    - 'open-api/**'
    - 'format/**'
    - '.gitattributes'
    - 'README.md'
    - 'CONTRIBUTING.md'
    - 'LICENSE'
    - 'NOTICE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-checks:
    runs-on: ubuntu-20.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: zulu
        java-version: 8
    - run: ./gradlew -DsparkVersions=3.1 build -x test -x javadoc -x integrationTest

  release:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8
      - run: echo -e "$(ip addr show eth0 | grep "inet\b" | awk '{print $2}' | cut -d/ -f1)\t$(hostname -f) $(hostname -s)" | sudo tee -a /etc/hosts

      - name: Perform release
        if: ${{ github.event_name == 'push'
          && github.ref == 'refs/heads/openhouse-1.2.0'
          && github.repository == 'linkedin/iceberg'
          && !contains(toJSON(github.event.commits.*.message), '[skip release]') }}
        run: ./gradlew -DsparkVersions=3.1 githubRelease publishToSonatype closeAndReleaseStagingRepository -x test -x integrationTest
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          SONATYPE_USER: ${{secrets.SONATYPE_USER}}
          SONATYPE_PWD: ${{secrets.SONATYPE_PWD}}
          PGP_KEY: ${{secrets.PGP_KEY}}
          PGP_PWD: ${{secrets.PGP_PWD}}
