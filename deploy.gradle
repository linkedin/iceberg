if (project.hasProperty('release') && jdkVersion != '8') {
  throw new GradleException("Releases must be built with Java 8")
}

subprojects {
  apply plugin: 'maven-publish'
  apply plugin: 'signing'

  afterEvaluate {
    def isBom = it.name == 'iceberg-bom'
    
    if (!isBom) {
      // Only create JAR tasks for non-BOM projects
      task sourceJar(type: Jar, dependsOn: classes) {
        archiveClassifier.set('sources')
        from sourceSets.main.allSource
        group 'build'
      }

      task javadocJar(type: Jar, dependsOn: javadoc) {
        archiveClassifier.set('javadoc')
        from javadoc.destinationDir
        group 'build'
      }

      task testJar(type: Jar) {
        archiveClassifier.set('tests')
        from sourceSets.test.output
      }

      artifacts {
        archives sourceJar
        archives javadocJar
        archives testJar
        testArtifacts testJar
      }

      // add LICENSE and NOTICE
      [jar, sourceJar, javadocJar, testJar].each { task ->
        task.dependsOn rootProject.tasks.buildInfo
        task.from("${rootDir}/build") {
          include 'iceberg-build.properties'
        }
        task.from(rootDir) {
          include 'LICENSE'
          include 'NOTICE'
        }
      }
    }

    publishing {
      publications {
        if (isBom) {
          // For BOM projects, publish the java-platform component
          mavenJava(MavenPublication) {
            from components.javaPlatform

            groupId = 'com.linkedin.iceberg'
            artifactId = project.archivesBaseName
            pom {
              name = artifactId
              description = 'A table format for huge analytic datasets'
              url = 'https://github.com/linkedin/iceberg'
              licenses {
                license {
                  name = 'The Apache Software License, Version 2.0'
                  url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                }
              }
              issueManagement {
                system = 'GitHub'
                url = 'https://github.com/linkedin/iceberg/issues'
              }
              developers {
                [
                  'wmoustafa:Walaa Eldin Moustafa',
                  'sumedhsakdeo:Sumedh Sakdeo',
                  'maluchari:Malini Mahalakshmi Venkatachari',
                  'rdsr:Ratandeep Ratti'
                ].each { devData ->
                  developer {
                    def devInfo = devData.split(':')
                    id = devInfo[0]
                    name = devInfo[1]
                    url = 'https://github.com/' + devInfo[0]
                    roles = ["Core developer"]
                  }
                }
              }
              scm {
                url = 'https://github.com/linkedin/iceberg.git'
              }
              ciManagement {
                url = 'https://github.com/linkedin/iceberg/actions'
                system = 'GitHub Actions'
              }
            }
          }
        } else {
          // For regular projects, publish java libraries with artifacts
          javaLibrary(MavenPublication) {
            if (tasks.matching({task -> task.name == 'shadowJar'}).isEmpty()) {
              from components.java
            } else {
              project.shadow.component(it)
            }

            artifact sourceJar
            artifact javadocJar
            artifact testJar

            versionMapping {
              allVariants {
                fromResolutionResult()
              }
            }

            groupId = 'com.linkedin.iceberg'
            artifactId = project.archivesBaseName
            pom {
              name = artifactId
              description = 'A table format for huge analytic datasets'
              url = 'https://github.com/linkedin/iceberg'
              licenses {
                license {
                  name = 'The Apache Software License, Version 2.0'
                  url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                }
              }
              issueManagement {
                system = 'GitHub'
                url = 'https://github.com/linkedin/iceberg/issues'
              }
              developers {
                [
                  'wmoustafa:Walaa Eldin Moustafa',
                  'sumedhsakdeo:Sumedh Sakdeo',
                  'maluchari:Malini Mahalakshmi Venkatachari',
                  'rdsr:Ratandeep Ratti'
                ].each { devData ->
                  developer {
                    def devInfo = devData.split(':')
                    id = devInfo[0]
                    name = devInfo[1]
                    url = 'https://github.com/' + devInfo[0]
                    roles = ["Core developer"]
                  }
                }
              }
              scm {
                url = 'https://github.com/linkedin/iceberg.git'
              }
              ciManagement {
                url = 'https://github.com/linkedin/iceberg/actions'
                system = 'GitHub Actions'
              }
            }
          }
        }
      }

      repositories {
        maven {
          url = "$rootProject.buildDir/repo"
        }
      }
    }

    if (isBom) {
      tasks.build.dependsOn("publishMavenJavaPublicationToMavenLocal")
    } else {
      tasks.build.dependsOn("publishJavaLibraryPublicationToMavenLocal")
    }

    signing {
      if (System.getenv("PGP_KEY")) {
        useInMemoryPgpKeys(System.getenv("PGP_KEY"), System.getenv("PGP_PWD"))
        if (isBom) {
          sign publishing.publications.mavenJava
        } else {
          sign publishing.publications.javaLibrary
        }
      }
    }
  }
}

